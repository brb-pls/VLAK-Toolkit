name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build .exe
        run: python -m PyInstaller --noconfirm --clean VLAK-Toolkit.spec
      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path dist/VLAK-Toolkit.exe -DestinationPath dist/VLAK-Toolkit-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VLAK-Toolkit
          path: dist/VLAK-Toolkit.exe
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VLAK-Toolkit.exe
            dist/VLAK-Toolkit-win64.zip
          generate_release_notes: true
